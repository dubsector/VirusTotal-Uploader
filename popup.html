<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
  <meta charset="UTF-8" />
  <title>VirusTotal Uploader</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      width: 320px;
      min-height: 260px;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }

    .dropzone {
      margin-top: 14px;
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      padding: 26px 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .dropzone:hover,
    .dropzone.dragover {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .dropzone svg {
      width: 30px;
      height: 30px;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .dropzone .primary-text {
      font-weight: 600;
    }

    .dropzone .secondary-text {
      color: var(--text-muted);
      font-size: 12.5px;
      margin-top: 3px;
    }

    #fileInput {
      display: none;
    }

    .status-card {
      margin-top: 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 13px 14px;
      background: var(--bg);
      box-shadow: var(--shadow);
      display: none;
    }

    .status-card.show {
      display: block;
    }

    .status-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .status-file {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-phase {
      font-size: 12.5px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .progress {
      margin-top: 10px;
      height: 6px;
      border-radius: 999px;
      background: var(--surface);
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 40%;
      border-radius: 999px;
      background: var(--accent);
    }

    /* Indeterminate sweep while checking/uploading. */
    .progress-bar.indeterminate {
      width: 40%;
      animation: sweep 1.1s ease-in-out infinite;
    }

    .progress-bar.waiting {
      width: 100%;
      background: var(--warning);
    }

    .progress-bar.done {
      width: 100%;
      background: var(--success);
    }

    .progress-bar.error {
      width: 100%;
      background: var(--danger);
    }

    @keyframes sweep {
      0% { margin-left: -40%; }
      100% { margin-left: 100%; }
    }

    .meta {
      margin-top: 8px;
      font-size: 12.5px;
      color: var(--text-muted);
    }

    .meta.error { color: var(--danger); }

    .footer {
      margin-top: auto;
      padding-top: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <img src="icons/icon48.png" alt="" />
      <span>VirusTotal Uploader</span>
    </div>
    <button id="settingsBtn" class="icon-btn" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
  </div>

  <div id="dropzone" class="dropzone" role="button" tabindex="0">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
      <polyline points="17 8 12 3 7 8"></polyline>
      <line x1="12" y1="3" x2="12" y2="15"></line>
    </svg>
    <div class="primary-text">Drop files or click to select</div>
    <div class="secondary-text" id="limitHint">Up to 32&nbsp;MB per file</div>
  </div>
  <input type="file" id="fileInput" multiple />

  <div id="statusCard" class="status-card">
    <div class="status-line">
      <span class="status-file" id="statusFile"></span>
      <span class="status-phase" id="statusPhase"></span>
    </div>
    <div class="progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="meta" id="statusMeta"></div>
  </div>

  <div class="footer">
    <a href="https://dubsector.dev" target="_blank" rel="noreferrer">dubsector.dev</a>
    <span id="queueBadge"></span>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
